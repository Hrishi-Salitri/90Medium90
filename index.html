  /* ---------- Overview stats ---------- */

    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;

  .stat-chip{
    background:var(--cream); border-radius:16px; padding:10px 16px;

  .stat-chip .num{font-family:'Baloo 2'; font-size:20px; font-weight:800; color:var(--pea-3);}
  .stat-chip .lbl{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.4px;}

  /* ---------- Day strip ---------- */
  .daystrip-outer{ margin-bottom:18px; }
  .daystrip-label{
    font-size:13px; font-weight:700; color:var(--pea-3); margin:0 4px 6px; text-align:center;
  }
  .daystrip{
    display:flex; gap:8px; overflow-x:auto; padding:6px 4px 12px;

  .daystrip::-webkit-scrollbar-thumb{background:var(--mint-2); border-radius:6px;}

    scroll-snap-align:center;

  .day-pill .dow{font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase;}
  .day-pill .dnum{font-family:'Baloo 2'; font-size:17px; font-weight:700; color:var(--ink);}
  .day-pill .dots{display:flex; justify-content:center; gap:3px; margin-top:4px;}
  .day-pill .dots span{width:7px;height:7px;border-radius:50%; background:#e3e3dd;}

  .day-pill.selected{border-color:var(--pea-2); background:var(--mint-1);}

  /* ---------- Selected day header ---------- */
  .selected-date-banner{

  .selected-date-banner .big{font-family:'Baloo 2'; font-size:19px; font-weight:700; color:var(--pea-3);}
  .selected-date-banner .small{font-size:12.5px; color:var(--muted); font-weight:600;}

  /* ---------- Pod cards ---------- */
  .pods{ display:grid; grid-template-columns:1fr; gap:18px; }

  .pod-card{
    background:var(--cream);
    border-radius:var(--radius);

    position:relative;

  .pod-card.complete{ border-color:var(--gold); box-shadow:0 8px 26px rgba(244,200,79,0.35);}
  .pod-card::before{

  .pod-head{ display:flex; align-items:center; gap:10px; position:relative; z-index:1; margin-bottom:10px;}
  .pea-avatar{
    width:46px; height:46px; border-radius:50%;

  .section-label{
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted); margin:14px 0 6px; position:relative; z-index:1;

  .item-row{
    display:flex; align-items:flex-start; gap:10px;
    padding:8px 6px; border-radius:12px; cursor:pointer;

  .checkbox{

  .alcohol-note{

  .alcohol-note label{ font-size:12px; color:var(--muted); font-weight:600; margin-right:6px;}

  /* ---------- Water widget ---------- */
  .water-box{
    margin-top:14px; background:linear-gradient(180deg, #eaf6ff, #f7fdff);

  }
  .water-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .water-top .wt-label{ font-size:12.5px; font-weight:800; color:#3f74ad; text-transform:uppercase; letter-spacing:.4px;}
  .water-top .wt-remain{ font-size:12.5px; font-weight:700; color:var(--muted);}
  .water-bar-outer{
    width:100%; height:16px; background:#dbeefc; border-radius:999px; overflow:hidden;

  .water-bar-inner{
    height:100%; background:linear-gradient(90deg, #7ec8f2, #4d9fe0);

  .water-bar-inner.full{ background:linear-gradient(90deg, #6fd18c, #3fae6b);}
  .water-count{ text-align:center; font-family:'Baloo 2'; font-size:22px; font-weight:700; color:#3f74ad; margin:8px 0 2px;}
  .water-count.full{ color:#2f8a56;}
  .water-goal-txt{ text-align:center; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:10px;}
  .water-btns{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .wbtn{
    border:none; background:#fff; color:#3f74ad; font-weight:700; font-size:13px;
    padding:8px 12px; border-radius:12px; cursor:pointer; box-shadow:var(--shadow-soft);
    display:flex; align-items:center; gap:5px;

  .wbtn:active{ transform:scale(0.95);}
  .wbtn.undo{ color:#b5654a; }

  /* ---------- Celebration ---------- */
  .confetti-piece{
    position:fixed; top:-20px; width:9px; height:14px; border-radius:2px;
    pointer-events:none; z-index:9999;

  .celebrate-toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-weight:700; font-size:14px;
    padding:12px 20px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,0.25);
    opacity:0; transition:all .4s ease; z-index:9998; text-align:center; max-width:88vw;
  }
  .celebrate-toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  .both-banner{
    display:none; text-align:center; margin:0 0 18px;
    background:linear-gradient(135deg, #fff4d6, #ffe9f0, #e3f6ff);
    border-radius:20px; padding:16px; box-shadow:var(--shadow);

  footer{ text-align:center; margin-top:30px; color:var(--muted); font-size:12px; font-weight:600; padding:0 20px;}
  footer a{color:var(--pea-3);}

  </footer>

<div class="celebrate-toast" id="toast"></div>

<script>
/* =========================================================================
   CONFIG & SUPABASE INITIALIZATION
   ========================================================================= */
const CONFIG = {
  START_DATE: "2026-08-12",   // Day 1
  TOTAL_DAYS: 90,
  STORAGE_KEY: "ninetyMediumState",
  SUPABASE_URL: "https://supabase.com/dashboard/project/nuelyvrhhopjxiasmqjc",         // Replace with your project URL
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51ZWx5dnJoaG9wanhpYXNtcWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1ODI5MTMsImV4cCI6MjEwMjE1ODkxM30.2_MWyiz_4IVjXIZ8iPWWiYTtFdurU3YlzkIXbkAKYog" // Replace with your anon key
};

const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

/* =========================================================================
   ITEM DEFINITIONS
   ========================================================================= */
const PEOPLE = {
  sejal: {
    name: "Sejal", key:"sejal", color:"sejal",
    avatar:"🌱",
    water:{ goal:96, bottleOz:24, bottleLabel:"1 Owala (24oz)" },
    physical: [
      {id:"steps",      label:"10,000 steps"},
      {id:"workout",    label:"Lift / Pilates / Yoga workout"},
      {id:"core",       label:"Core workout", weekly:3},
      {id:"nofastfood", label:"No fast food / soda"},
      {id:"eatcutoff",  label:"Finished eating 2 hrs before bed"},
      {id:"mealplan",   label:"Cooked / planned meals for the week", weekly:1},
      {id:"alcohol",    label:"Logged alcohol intake (or none)", hasCount:true},
    ],
    mental: [
      {id:"read",    label:"Read 5 pages"},
      {id:"nomedia", label:"No media 30 min pre &amp; post sleep"},
      {id:"journal", label:"Journaled / meditated", weekly:3},
    ]
  },
  hrishi: {
    name: "Hrishi", key:"hrishi", color:"hrishi",
    avatar:"🌿",
    water:{ goal:120, bottleOz:24, bottleLabel:"1 Owala (24oz)" },
    physical: [
      {id:"stretch",    label:"Stretching / mobility session"},
      {id:"workout",    label:"Lift / Run / Bike / HIIT / Cardio"},
      {id:"core",       label:"Core workout", weekly:2},
      {id:"nofastfood", label:"No fast food / soda"},
      {id:"eatcutoff",  label:"Finished eating 2 hrs before bed"},
      {id:"calorie",    label:"Loosely followed calorie / protein goals"},
      {id:"alcohol",    label:"Logged alcohol intake (or none)", hasCount:true},
    ],
    mental: [
      {id:"read",     label:"Read 5 pages"},
      {id:"newsread", label:"News or financial literacy article/video"},
      {id:"nomedia",  label:"No media in am / 30 min pre-sleep"},
      {id:"learn",    label:"Learned something new", weekly:1},
    ]
  }
};

/* =========================================================================
   DATE HELPERS
   ========================================================================= */
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y, m-1, d); }
function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(iso, n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
const START = CONFIG.START_DATE;
const ALL_DATES = Array.from({length: CONFIG.TOTAL_DAYS}, (_,i)=> addDays(START, i));
function todayISO(){ return toISO(new Date()); }
function dowShort(iso){ return parseISO(iso).toLocaleDateString(undefined,{weekday:"short"}); }
function niceDate(iso){ return parseISO(iso).toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"}); }
function weekKey(iso){
  const d=parseISO(iso);
  const dow=(d.getDay()+6)%7; // 0=Mon
  const monday=new Date(d); monday.setDate(d.getDate()-dow);
  return toISO(monday);
}

/* =========================================================================
   LOCAL & SUPABASE DUAL STORAGE
   ========================================================================= */
function safeLocalGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function safeLocalSet(key,val){ try{ localStorage.setItem(key,val); return true; }catch(e){ return false; } }

function loadLocalState(){
  const raw = safeLocalGet(CONFIG.STORAGE_KEY);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(parsed && parsed.sejal && parsed.hrishi) return parsed;
    }catch(e){ }
  }
  return { sejal:{days:{}}, hrishi:{days:{}} };
}

function updatePillStatus(status, isWarn=false){
  const pill = document.getElementById("storagePill");
  const text = document.getElementById("storageText");
  pill.classList.toggle("warn", isWarn);
  text.textContent = status;
}

async function syncWithSupabase(){
  updatePillStatus("Syncing...");
  try {
    const { data, error } = await supabaseClient.from('tracker_state').select('data').eq('id', 1).single();
    if (error && error.code !== 'PGRST116') {
      console.error("Supabase load error:", error);
      updatePillStatus("Saved locally (offline)", true);
      return;
    }
    if (data && data.data) {
      state = data.data;
      safeLocalSet(CONFIG.STORAGE_KEY, JSON.stringify(state));
      renderAll();
    } else {
      await saveState();
    }
    updatePillStatus("Synced with Supabase ☁️");
  } catch(e) {
    console.error("Supabase sync exception:", e);
    updatePillStatus("Saved locally (offline)", true);
  }
}

async function saveState(){
  safeLocalSet(CONFIG.STORAGE_KEY, JSON.stringify(state));
  updatePillStatus("Saving...");
  try {
    const { error } = await supabaseClient.from('tracker_state').upsert({ id: 1, data: state, updated_at: new Date() });
    if(error) {
      console.error("Supabase save error:", error);
      updatePillStatus("Saved locally (cloud error)", true);
    } else {
      updatePillStatus("Synced with Supabase ☁️");
    }
  } catch(e) {
    console.error("Supabase save exception:", e);
    updatePillStatus("Saved locally (offline)", true);
  }
}

function subscribeToRealtime(){
  supabaseClient
    .channel('public:tracker_state')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'tracker_state', filter: 'id=eq.1' }, payload => {
      if(payload.new && payload.new.data){
        state = payload.new.data;
        safeLocalSet(CONFIG.STORAGE_KEY, JSON.stringify(state));
        renderAll();
        toast("Updated live from other device! 🔄", 2000);
      }
    })
    .subscribe();
}

/* =========================================================================
   STATE
   ========================================================================= */
let state = loadLocalState();
let selectedDate = ALL_DATES.includes(todayISO()) ? todayISO() : START;
let celebratedToday = {}; 

function blankDay(){ return { checks:{}, water:0, drinksCount:0 }; }
function getDay(personKey, iso){
  const days = state[personKey].days;
  if(!days[iso]) days[iso] = blankDay();
  if(days[iso].checks===undefined) days[iso].checks = {};
  if(days[iso].water===undefined) days[iso].water = 0;
  if(days[iso].drinksCount===undefined) days[iso].drinksCount = 0;
  return days[iso];
}

/* =========================================================================
   REQUIRED-ITEM / COMPLETION LOGIC
   ========================================================================= */
function requiredItems(person){
  return [...person.physical, ...person.mental].filter(it=>!it.weekly);
}
function isDayComplete(personKey, iso){
  const person = PEOPLE[personKey];
  const day = getDay(personKey, iso);
  const reqs = requiredItems(person);
  const allChecked = reqs.every(it => !!day.checks[it.id]);
  const waterOk = day.water >= person.water.goal;
  return allChecked && waterOk;
}
function weeklyCount(personKey, itemId, iso){
  const wk = weekKey(iso);
  const days = state[personKey].days;
  let count=0;
  Object.keys(days).forEach(d=>{
    if(weekKey(d)===wk && days[d].checks && days[d].checks[itemId]) count++;
  });
  return count;
}

/* =========================================================================
   CONFETTI + TOAST
   ========================================================================= */
function toast(msg, ms=3200){
  const t=document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove("show"), ms);
}
function confettiBurst(count=60){
  const colors=["#8cc63f","#f2a6c1","#8fb8e8","#f4c84f","#5fa83f","#fff"];
  for(let i=0;i<count;i++){
    const el=document.createElement("div");
    el.className="confetti-piece";
    el.style.left = (Math.random()*100)+"vw";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    const duration = 2200 + Math.random()*1400;
    const drift = (Math.random()-0.5)*160;
    document.body.appendChild(el);
    el.animate([
      { transform:`translate(0,0) rotate(0deg)`, opacity:1 },
      { transform:`translate(${drift}px, 100vh) rotate(${360+Math.random()*360}deg)`, opacity:0.9 }
    ], { duration, easing:"cubic-bezier(.25,.46,.45,.94)" });
    setTimeout(()=>el.remove(), duration+50);
  }
}

/* =========================================================================
   RENDERING
   ========================================================================= */
function renderOverview(){
  const el=document.getElementById("overview");
  const dayIdx = ALL_DATES.indexOf(todayISO());
  const dayNum = dayIdx>=0 ? dayIdx+1 : (todayISO() < START ? 0 : CONFIG.TOTAL_DAYS);
  function countComplete(personKey){
    return ALL_DATES.filter(d => d <= todayISO() && isDayComplete(personKey,d)).length;
  }
  function streak(personKey){
    let s=0;
    for(let i=ALL_DATES.indexOf(todayISO()); i>=0; i--){
      const d=ALL_DATES[i];
      if(d>todayISO()) continue;
      if(isDayComplete(personKey,d)) s++; else break;
    }
    return s;
  }
  el.innerHTML = `
    <div class="stat-chip"><div class="num">${Math.max(dayNum,0)}/${CONFIG.TOTAL_DAYS}</div><div class="lbl">Day of challenge</div></div>
    <div class="stat-chip"><div class="num">${countComplete("sejal")}</div><div class="lbl">Sejal complete</div></div>
    <div class="stat-chip"><div class="num">${countComplete("hrishi")}</div><div class="lbl">Hrishi complete</div></div>
    <div class="stat-chip"><div class="num">${streak("sejal")}🔥</div><div class="lbl">Sejal streak</div></div>
    <div class="stat-chip"><div class="num">${streak("hrishi")}🔥</div><div class="lbl">Hrishi streak</div></div>
  `;
}

function renderDayStrip(){
  const strip=document.getElementById("daystrip");
  strip.innerHTML = ALL_DATES.map((d,i)=>{
    const isToday = d===todayISO();
    const isSel = d===selectedDate;
    const sOn = isDayComplete("sejal",d);
    const hOn = isDayComplete("hrishi",d);
    return `<div class="day-pill ${isToday?'today':''} ${isSel?'selected':''}" data-date="${d}">
      <div class="idx">D${i+1}</div>
      <div class="dow">${dowShort(d)}</div>
      <div class="dnum">${parseISO(d).getDate()}</div>
      <div class="dots"><span class="${sOn?'on-s':''}"></span><span class="${hOn?'on-h':''}"></span></div>
    </div>`;
  }).join("");
  strip.querySelectorAll(".day-pill").forEach(p=>{
    p.addEventListener("click", ()=>{ selectedDate = p.dataset.date; renderAll(); scrollDayIntoView(); });
  });
}
function scrollDayIntoView(){
  const strip=document.getElementById("daystrip");
  const el = strip.querySelector(`.day-pill.selected`);
  if(el) el.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
}

function renderSelectedBanner(){
  document.getElementById("selBig").textContent = niceDate(selectedDate);
  const idx = ALL_DATES.indexOf(selectedDate);
  document.getElementById("selSmall").textContent = `Day ${idx+1} of ${CONFIG.TOTAL_DAYS}`;
}

function itemRowHTML(personKey, item, iso){
  const day = getDay(personKey, iso);
  const checked = !!day.checks[item.id];
  let weeklyBadge = "";
  if(item.weekly){
    const c = weeklyCount(personKey, item.id, iso);
    const met = c>=item.weekly;
    weeklyBadge = `<span class="weekly-badge ${met?'met':''}">${c}/${item.weekly} this wk${met?' ✓':''}</span>`;
  }
  let extra = "";
  if(item.hasCount && checked){
    extra = `<div class="alcohol-note">
      <label># drinks (optional):</label>
      <input type="number" min="0" step="1" value="${day.drinksCount||0}" data-drinkinput="${personKey}|${iso}">
    </div>`;
  }
  return `<div class="item-row ${checked?'checked':''}" data-check="${personKey}|${iso}|${item.id}">
      <div class="checkbox">${checked?'✓':''}</div>
      <div class="item-text">${item.label}</div>
      ${weeklyBadge}
    </div>${extra}`;
}

function waterWidgetHTML(personKey, iso){
  const person = PEOPLE[personKey];
  const day = getDay(personKey, iso);
  const goal = person.water.goal;
  const cur = day.water||0;
  const pct = Math.min(100, Math.round((cur/goal)*100));
  const full = cur>=goal;
  const remain = Math.max(0, goal-cur);
  return `<div class="water-box">
    <div class="water-top">
      <div class="wt-label">💧 Water</div>
      <div class="wt-remain">${full? 'Goal reached! 🎉' : remain+' oz to go'}</div>
    </div>
    <div class="water-bar-outer"><div class="water-bar-inner ${full?'full':''}" style="width:${pct}%"></div></div>
    <div class="water-count ${full?'full':''}">${cur} / ${goal} oz</div>
    <div class="water-goal-txt">Goal: ${goal}oz (${person.water.bottleLabel} × ${Math.round(goal/person.water.bottleOz)})</div>
    <div class="water-btns">
      <button class="wbtn" data-water="${personKey}|${iso}|8">+8oz 🥤</button>
      <button class="wbtn" data-water="${personKey}|${iso}|16">+16oz</button>
      <button class="wbtn" data-water="${personKey}|${iso}|${person.water.bottleOz}">+${person.water.bottleOz}oz 🍶 bottle</button>
      <button class="wbtn custom" data-watercustom="${personKey}|${iso}">+ custom</button>
      <button class="wbtn undo" data-water="${personKey}|${iso}|-8">− undo 8oz</button>
    </div>
  </div>`;
}

function renderPersonCard(personKey){
  const person = PEOPLE[personKey];
  const el = document.getElementById(personKey==="sejal"?"cardSejal":"cardHrishi");
  const complete = isDayComplete(personKey, selectedDate);
  el.classList.toggle("complete", complete);

  el.innerHTML = `
    <div class="pod-head">
      <div class="pea-avatar">${person.avatar}</div>
      <h2>${person.name}${complete?' 🌟':''}</h2>
      <div class="streak">${complete? '<b>All done!</b> 💚' : ''}</div>
    </div>
    <div class="section-label">Physical</div>
    ${person.physical.map(it=>itemRowHTML(personKey, it, selectedDate)).join("")}
    <div class="section-label">Mental</div>
    ${person.mental.map(it=>itemRowHTML(personKey, it, selectedDate)).join("")}
    ${waterWidgetHTML(personKey, selectedDate)}
  `;

  el.querySelectorAll("[data-check]").forEach(row=>{
    row.addEventListener("click", (ev)=>{
      if(ev.target.tagName==="INPUT") return;
      const [pKey, iso, itemId] = row.dataset.check.split("|");
      const day = getDay(pKey, iso);
      const wasComplete = isDayComplete(pKey, iso);
      day.checks[itemId] = !day.checks[itemId];
      const nowComplete = isDayComplete(pKey, iso);
      handleCompletionChange(pKey, iso, wasComplete, nowComplete);
      saveState();
      renderAll();
    });
  });
  el.querySelectorAll("[data-drinkinput]").forEach(inp=>{
    inp.addEventListener("click", e=>e.stopPropagation());
    inp.addEventListener("change", ()=>{
      const [pKey, iso] = inp.dataset.drinkinput.split("|");
      getDay(pKey, iso).drinksCount = parseInt(inp.value||"0",10) || 0;
      saveState();
    });
  });
  el.querySelectorAll("[data-water]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [pKey, iso, amtStr] = btn.dataset.water.split("|");
      const amt = parseInt(amtStr,10);
      const day = getDay(pKey, iso);
      const wasComplete = isDayComplete(pKey, iso);
      day.water = Math.max(0, (day.water||0) + amt);
      const nowComplete = isDayComplete(pKey, iso);
      handleCompletionChange(pKey, iso, wasComplete, nowComplete);
      saveState();
      renderAll();
    });
  });
  el.querySelectorAll("[data-watercustom]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [pKey, iso] = btn.dataset.watercustom.split("|");
      const val = prompt("Add how many ounces?");
      const amt = parseInt(val,10);
      if(!isNaN(amt) && amt!==0){
        const day = getDay(pKey, iso);
        const wasComplete = isDayComplete(pKey, iso);
        day.water = Math.max(0, (day.water||0) + amt);
        const nowComplete = isDayComplete(pKey, iso);
        handleCompletionChange(pKey, iso, wasComplete, nowComplete);
        saveState();
        renderAll();
      }
    });
  });
}

function handleCompletionChange(personKey, iso, wasComplete, nowComplete){
  const key = `${personKey}|${iso}`;
  if(nowComplete && !wasComplete && !celebratedToday[key]){
    celebratedToday[key] = true;
    confettiBurst(50);
    toast(`${PEOPLE[personKey].name}'s pea is glowing! ✨ ${niceDate(iso)} all done!`);
    const otherKey = personKey==="sejal" ? "hrishi" : "sejal";
    if(isDayComplete(otherKey, iso)){
      setTimeout(()=>{ confettiBurst(90); showBothBanner(); }, 500);
    }
  }
  if(!nowComplete && wasComplete){
    celebratedToday[key] = false;
  }
}
function showBothBanner(){
  const b=document.getElementById("bothBanner");
  b.classList.add("show");
  toast("🎉 Two peas, one pod — you BOTH finished today!", 4000);
  setTimeout(()=>b.classList.remove("show"), 6000);
}

function renderAll(){
  renderOverview();
  renderDayStrip();
  renderSelectedBanner();
  renderPersonCard("sejal");
  renderPersonCard("hrishi");
  document.getElementById("bothBanner").classList.toggle("show", isDayComplete("sejal",selectedDate) && isDayComplete("hrishi",selectedDate));
}

/* =========================================================================
   INIT
   ========================================================================= */
(async function init(){
  renderAll();
  scrollDayIntoView();
  await syncWithSupabase();
  subscribeToRealtime();
})();
</script>
</body>
